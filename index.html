<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Grade Calculator - Created by Apon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">

        <nav>
            <span class="logo"></span>
            <a href="#calc">Calculator</a>
        </nav>

        <h1>Get your grade in just one click</h1>

        <p>
            Enter your S.S.C/H.S.C number and get grade instantly
        </p>

    </header>


    <section id="calc" class="card">

        <h2>Enter your marks</h2>

        <input
            id="mark"
            type="number"
            min="0"
            max="100"
            placeholder="0-100"
        >

        <button id="btn">Show Grade</button>

        <div id="out" class="result"></div>

    </section>


    <section class="tips">

        <h2>Grade Chart</h2>

        <ul>
            <li>80+ -- A+</li>
            <li>70-79 -- A</li>
            <li>60-69 -- B</li>
            <li>50-59 -- C</li>
            <li>33-49 -- D</li>
        </ul>

    </section>


    <footer>
        @ Apon creation 2026
    </footer>


    <script src="app.js"></script>

</body>

</html>
